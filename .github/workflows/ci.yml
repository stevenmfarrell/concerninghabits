# Checks every pull request (and every push to main). Pull requests can only merge into main once
# all three jobs pass: the "Protect main" ruleset requires the "Tests", "README drift" and
# "End-to-end" checks, by these job names, so rename them there too if they change here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Docker image's Node version (see the Dockerfile)
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # A schema change committed without its migration would leave self-hosters' databases behind,
      # since the container only applies committed migrations. Fails if they differ.
      - name: Migrations match the schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "file:$RUNNER_TEMP/shadow.db" --exit-code

      - run: npm run lint

      # next-env.d.ts and the route types are generated (and gitignored), so make them first
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - run: npm test

  readme:
    name: README drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/check-readme.mjs

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Only Chromium, the browser the tests run in (see playwright.config.ts), with what it needs
      # from the system
      - run: npx playwright install --with-deps chromium

      # Builds, then serves the build on a fresh database (scripts/e2e-server.mjs) and runs e2e/
      - run: npm run test:e2e

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
