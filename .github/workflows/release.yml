# Builds the Docker image for amd64 and arm64 and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/<repo>) when a version tag like v1.2.3 is pushed. Each architecture builds on its
# own native runner (much faster than emulating arm64), pushes its image by digest, and a final job
# joins the two into one multi-arch image under the version's tags.
#
# Pull requests and pushes to main that touch the image build both architectures without
# publishing, so a broken Dockerfile shows up before a release does. The main builds also save the
# build cache that pull requests and releases reuse (see cache-to below).
name: Release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - prisma/**
      - public/**
      - src/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - prisma/**
      - public/**
      - src/**
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Name this platform's cache and digest artifact
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here; the tags go on the joined image in the merge job
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Concerning Habits
            org.opencontainers.image.description=A self-hosted, AI-powered habit tracker
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          # Only main's builds save the cache (uploading it takes minutes). A build can only read the
          # cache of its own branch or main, so one saved from a pull request or tag is never reused,
          # while main's is read by every later pull request and release.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', env.PLATFORM_PAIR) || '' }}

      - name: Save digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 is tagged 1.2.3, 1.2 and 1 (so users can pin how far they follow), plus latest.
      # A pre-release like v1.3.0-rc.1 only gets its own tag: metadata-action leaves latest and the
      # shorter versions off it. The annotations go on the multi-arch index itself, which is what
      # GHCR reads for the package's description and license.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          annotations: |
            org.opencontainers.image.title=Concerning Habits
            org.opencontainers.image.description=A self-hosted, AI-powered habit tracker
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Create the multi-arch image under each tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect the published image
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
